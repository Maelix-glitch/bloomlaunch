<!doctype html>

    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og.jpg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bloom — Your life, in bloom." />

      property="og:description"
      content="Mood, cycle, habits, trackers, coaching and rewards — one intelligent ecosystem for becoming your best self."
    />

    <link rel="dns-prefetch" href="https://formspree.io" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />

    <!-- The overture starts downloading the hero sequence before React boots. -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" as="image" href="/frames/poster.webp" fetchpriority="high" />

    <style>
      /* Paint the brand background immediately — no white flash before hydration. */
      html,
      body {
        margin: 0;
        background: #050506;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; color: #f5f5f8; font-family: system-ui, sans-serif">
        <h1 style="font-family: Georgia, serif; font-weight: 400">Bloom — your life, in bloom.</h1>
        <p style="color: rgba(245,245,248,0.6); max-width: 44ch">
          Mood, cycle, habits, trackers, coaching and rewards in one intelligent ecosystem.
          Please enable JavaScript to explore the full experience.
        </p>
        <img src="/frames/still.webp" alt="Bloom's nine surfaces connected to a laptop by the Bloom mark"
             style="width: 100%; max-width: 1100px; margin-top: 32px; border-radius: 16px" />
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
